[project]
name = "genuino-mcp"
version = "0.1.0"
description = "Servidor MCP de verificacao do metodo Genuino: gates de qualidade, seguranca e anti-inflacao."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Luiz Gabriel Vieira Bandeira" }]
dependencies = [
    "mcp>=2.1.1,<3",
]

[project.scripts]
genuino-mcp = "genuino_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genuino_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
